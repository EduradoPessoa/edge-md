[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgemd"
version = "0.1.0"
description = "Leitor e editor de Markdown para Windows, com tema unificado, bandeja e associação de arquivo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["markdown", "editor", "viewer", "windows", "pyqt6", "mermaid", "katex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Editors :: Documentation",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    # A versão do WebEngine precisa acompanhar a linha do PyQt6, senão o
    # runtime Qt fica com duas versões e o Chromium não sobe.
    "PyQt6>=6.10,<6.11",
    "PyQt6-WebEngine==6.10.0",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "Pygments>=2.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4"]
build = ["pyinstaller>=6.0", "Pillow>=10.0"]

[project.gui-scripts]
edgemd = "edgemd.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edgemd = ["render/assets/*.css", "render/assets/vendor/*", "resources/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
