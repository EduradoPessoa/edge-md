name: release

# Gera os executáveis e instaladores das três plataformas.
#
# Duas formas de disparar:
#   * manualmente, por workflow_dispatch, para testar o empacotamento;
#   * publicando uma tag (v0.1.0), que além de compilar anexa os artefatos a um
#     GitHub Release.
#
# O PyInstaller não compila para outra plataforma, então a matriz não é uma
# escolha de conveniência: cada sistema precisa do próprio runner para produzir
# o seu binário.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      anexar_release:
        description: "Anexar os artefatos a um Release (só faz sentido com tag)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------
  # Windows: pasta + instalador Inno Setup
  # ---------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Baixar bibliotecas de diagrama e fórmula
        run: python tools/fetch_vendor.py

      - name: Gerar ícones
        run: python tools/make_icons.py

      - name: Gerar o bundle
        run: python -m PyInstaller edgemd.spec --noconfirm --clean

      - name: Descobrir a versão
        id: versao
        shell: bash
        # A versão vem da tag quando há uma, e do pyproject.toml caso contrário.
        # Ler ${GITHUB_REF_NAME#v} direto dava "main" numa execução manual a
        # partir da branch, e o empacotador recusava o valor.
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSAO="${GITHUB_REF_NAME#v}"
          else
            VERSAO="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          fi
          echo "valor=${VERSAO}" >> "$GITHUB_OUTPUT"
          echo "Versão: ${VERSAO}"

      - name: Instalar o Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Gerar o instalador
        run: iscc /DAppVersion=${{ steps.versao.outputs.valor }} packaging\windows\edgemd.iss

      - uses: actions/upload-artifact@v4
        with:
          name: EdgeMD-windows
          path: |
            dist/installer/*.exe
            dist/edgemd/**
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Windows: pacote MSIX, além do instalador .exe
  #
  # Por que os dois formatos: o .exe instala sem assinatura e sem
  # administrador, então é o caminho padrão. O MSIX dá instalação e
  # desinstalação limpas, mas o Windows SÓ instala um MSIX cujo certificado
  # seja confiável na máquina — verificado na prática, e não há como contornar.
  #
  # Por isso o trabalho publica o pacote junto com o certificado: quem quiser
  # usar o MSIX confia no certificado uma vez (exige administrador) e depois
  # instala normalmente. Para distribuir sem esse passo seria preciso um
  # certificado de code signing de uma autoridade certificadora.
  # ---------------------------------------------------------------------
  windows-msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Baixar bibliotecas de diagrama e fórmula
        run: python tools/fetch_vendor.py

      - name: Gerar ícones
        run: python tools/make_icons.py

      - name: Gerar o bundle
        run: python -m PyInstaller edgemd.spec --noconfirm --clean

      - name: Descobrir a versão
        id: versao
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSAO="${GITHUB_REF_NAME#v}"
          else
            VERSAO="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          fi
          echo "valor=${VERSAO}" >> "$GITHUB_OUTPUT"
          echo "Versão: ${VERSAO}"

      - name: Conferir as ferramentas do SDK (makeappx e signtool)
        shell: pwsh
        # O runner do GitHub já traz o Windows SDK instalado, e é de lá que o
        # build_msix.ps1 pega o makeappx e o signtool.
        #
        # A versão anterior deste passo COPIava os .exe para uma pasta local, e
        # isso os quebrava: o makeappx depende de um assembly lado-a-lado que
        # fica na pasta do SDK, então a cópia existe mas não inicia —
        #
        #   The application has failed to start because its side-by-side
        #   configuration is incorrect.
        #
        # Agora nada é copiado: as ferramentas são usadas onde estão, e o
        # script valida cada candidato executando-o antes de aceitar.
        run: |
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          if (-not (Test-Path $kits)) {
            Write-Host "::warning::Windows SDK não encontrado; o passo do MSIX vai baixar o pacote NuGet"
            exit 0
          }

          Write-Host "Windows SDK presente em $kits :"
          Get-ChildItem $kits -Directory | Sort-Object Name -Descending |
            ForEach-Object { "  $($_.Name)" }

          $makeappx = Get-ChildItem $kits -Directory | Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName "x64\makeappx.exe" } |
            Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $makeappx) {
            Write-Host "::warning::makeappx.exe não encontrado no SDK; o passo do MSIX vai tentar o NuGet"
            exit 0
          }

          # Executar no lugar, e não copiado, é o que faz funcionar.
          Write-Host "Verificando $makeappx"
          $saida = & $makeappx 2>&1 | Select-Object -First 1
          Write-Host "  resposta: $saida"
          if ($saida -notmatch 'MakeAppx') {
            Write-Host "::error::makeappx.exe não executa: $saida"
            exit 1
          }

      - name: Gerar e assinar o MSIX
        shell: pwsh
        # Autoassinado: o certificado gerado aqui é de desenvolvimento, e vai
        # junto no artefato para quem for instalar poder confiar nele.
        run: |
          .\packaging\windows\build_msix.ps1 `
            -Versao "${{ steps.versao.outputs.valor }}" `
            -SelfSigned

      - uses: actions/upload-artifact@v4
        with:
          name: EdgeMD-msix
          path: |
            dist/msix/*.msix
            dist/msix/*.cer
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Linux: .deb e AppImage
  # ---------------------------------------------------------------------
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar bibliotecas do Qt
        # O empacotamento precisa das bibliotecas de sistema para o PyInstaller
        # coletá-las; sem elas, o bundle sai incompleto.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxkbcommon-x11-0

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Baixar bibliotecas de diagrama e fórmula
        run: python tools/fetch_vendor.py

      - name: Gerar ícones
        run: python tools/make_icons.py

      - name: Gerar o bundle
        run: python -m PyInstaller edgemd.spec --noconfirm --clean

      - name: Descobrir a versão
        id: versao
        shell: bash
        # A versão vem da tag quando há uma, e do pyproject.toml caso contrário.
        # Ler ${GITHUB_REF_NAME#v} direto devolvia "main" numa execução manual a
        # partir da branch, e o dpkg-deb recusava o valor — foi assim que a
        # primeira execução desta matriz falhou.
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSAO="${GITHUB_REF_NAME#v}"
          else
            VERSAO="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          fi
          echo "valor=${VERSAO}" >> "$GITHUB_OUTPUT"
          echo "Versão: ${VERSAO}"

      - name: Gerar o .deb e o AppImage
        run: |
          chmod +x packaging/linux/*.sh
          packaging/linux/build_deb.sh "${{ steps.versao.outputs.valor }}"
          packaging/linux/build_appimage.sh "${{ steps.versao.outputs.valor }}"

      - uses: actions/upload-artifact@v4
        with:
          name: EdgeMD-linux
          path: |
            dist/linux/*.deb
            dist/linux/*.AppImage
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # macOS: bundle .app dentro de um DMG
  # ---------------------------------------------------------------------
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Baixar bibliotecas de diagrama e fórmula
        run: python tools/fetch_vendor.py

      - name: Gerar ícones
        run: python tools/make_icons.py

      - name: Gerar o bundle .app
        run: python -m PyInstaller edgemd.spec --noconfirm --clean

      - name: Descobrir a versão
        id: versao
        shell: bash
        # Da tag quando há uma; do pyproject.toml caso contrário. Ler o nome da
        # ref direto devolvia "main" numa execução manual.
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSAO="${GITHUB_REF_NAME#v}"
          else
            VERSAO="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          fi
          echo "valor=${VERSAO}" >> "$GITHUB_OUTPUT"
          echo "Versão: ${VERSAO}"

      - name: Gerar o DMG
        run: |
          chmod +x packaging/macos/*.sh
          packaging/macos/build_dmg.sh "${{ steps.versao.outputs.valor }}"

      - uses: actions/upload-artifact@v4
        with:
          name: EdgeMD-macos
          path: dist/macos/*.dmg
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Release
  # ---------------------------------------------------------------------
  publicar:
    needs: [windows, windows-msix, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 traz o histórico e as tags, que o passo do changelog
      # precisa para listar os commits desde a versão anterior.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artefatos

      # O download-artifact achata os caminhos: o que foi enviado como
      # dist/linux/x.deb chega como EdgeMD-linux/x.deb, sem o "dist". Os globs
      # abaixo refletem isso — e a conferência existe porque o
      # softprops/action-gh-release NÃO falha quando o glob não casa nada: ele
      # publica uma Release sem anexo e reporta sucesso. Foi o que aconteceu na
      # primeira tag, e só se percebe olhando a Release.
      - name: Conferir os artefatos antes de publicar
        run: |
          echo "Árvore recebida:"
          find artefatos -maxdepth 2 -type f | sort | sed 's/^/  /'

          # nullglob faz o glob que não casa virar lista vazia, em vez de virar
          # o próprio padrão literal — com `ls`, um padrão sem resultado ainda
          # imprime erro no stderr e complica a checagem sob `set -e`.
          shopt -s nullglob

          faltando=0
          for padrao in \
            "artefatos/EdgeMD-windows/installer/*.exe" \
            "artefatos/EdgeMD-msix/*.msix" \
            "artefatos/EdgeMD-msix/*.cer" \
            "artefatos/EdgeMD-linux/*.deb" \
            "artefatos/EdgeMD-linux/*.AppImage" \
            "artefatos/EdgeMD-macos/*.dmg"
          do
            arquivos=( $padrao )
            if [ "${#arquivos[@]}" -eq 0 ]; then
              echo "::error::nenhum arquivo para o padrão: $padrao"
              faltando=1
            else
              echo "ok (${#arquivos[@]}): ${arquivos[*]}"
            fi
          done
          exit $faltando

      # O corpo é montado aqui em vez de usar generate_release_notes: as duas
      # coisas não se somam — com generate_release_notes ligado, o GitHub gera o
      # corpo e o body_path é ignorado, e a Release sai só com o link do
      # changelog. Montando à mão, o texto das notas e a lista de commits
      # convivem.
      - name: Montar o corpo da Release
        run: |
          cp .github/RELEASE_NOTES.md corpo.md

          {
            echo
            echo "## Commits desta versão"
            echo
            anterior="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
            if [ -n "$anterior" ]; then
              echo "Desde \`${anterior}\`:"
              echo
              git log --no-merges --pretty='- %s — %h' "${anterior}..${GITHUB_REF_NAME}"
            else
              echo "Primeira versão publicada. Histórico completo:"
              echo
              git log --no-merges --pretty='- %s — %h' "${GITHUB_REF_NAME}" | head -60
            fi
            echo
            echo "**Changelog completo**: https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}"
          } >> corpo.md

          echo "Corpo montado: $(wc -l < corpo.md) linhas"

      - name: Publicar o Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: corpo.md
          # Sem isto, um glob que não casa nada publica uma Release vazia em
          # silêncio — foi exatamente o defeito da primeira tag v0.1.0.
          fail_on_unmatched_files: true
          files: |
            artefatos/EdgeMD-windows/installer/*.exe
            artefatos/EdgeMD-msix/*.msix
            artefatos/EdgeMD-msix/*.cer
            artefatos/EdgeMD-linux/*.deb
            artefatos/EdgeMD-linux/*.AppImage
            artefatos/EdgeMD-macos/*.dmg
